name: Check PR Size

on:
  workflow_call:
    inputs:
      threshold_lines:
        description: "PRの変更行数の閾値"
        type: number
        default: 100
        required: false
      exclude_patterns:
        description: "行数計測から除外するファイルパターン(カンマ区切り) ex: './*.lock, ./**/*.md'"
        type: string
        required: false

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        uses: actions/github-script@v7
        env:
          WARNING_ID_COMMENT: "<!-- PR_SIZE_CHECK_WARNING -->"
        with:
          script: |
            const { WARNING_ID_COMMENT } = process.env;
            const THRESHOLD = ${{ inputs.threshold_lines }};
            const excludePatterns = ('${{ inputs.exclude_patterns }}'.trim() || '').split(',')
              .filter(p => p.trim() !== '')
              .map(p => p.trim());

            console.log("除外パターン:", excludePatterns);

            // PRのファイル一覧を取得（ページネーション対応）
            async function getAllPRFiles() {
              let allFiles = [];
              let page = 1;
              let hasMorePages = true;
              
              while (hasMorePages) {
                const response = await github.rest.pulls.listFiles({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                  page: page
                });
                
                allFiles = allFiles.concat(response.data);
                console.log(`ページ ${page} のファイル数: ${response.data.length}`);
                
                // 次のページがあるかどうかを確認
                // 返されたデータが一度に取得可能な最大数（per_page）と同じなら次のページがある可能性がある
                hasMorePages = response.data.length === 100;
                page++;
              }
              
              return allFiles;
            }

            const allFiles = await getAllPRFiles();
            console.log(`PR内の合計ファイル数: ${allFiles.length}`);

            // 除外パターンに一致しないファイルだけをフィルタリング
            function shouldIncludeFile(filename) {
              // 除外パターンが指定されていない場合はすべて含む
              if (excludePatterns.length === 0) return true;
              
              // いずれかの除外パターンに一致する場合は除外
              for (const pattern of excludePatterns) {
                // グロブパターンから正規表現に変換する関数
                function globToRegExp(glob) {
                  // 先頭の "./" を処理（任意にする）
                  let processedGlob = glob;
                  if (processedGlob.startsWith('./')) {
                    processedGlob = `(\\./)?${processedGlob.substring(2)}`;
                  }
                  
                  // 特殊文字をエスケープ（*と?以外）
                  let regexStr = processedGlob.replace(/[.+^${}()|[\]\\]/g, '\\$&');
                  
                  // ** を一時的なプレースホルダーに置き換え
                  regexStr = regexStr.replace(/\*\*/g, '{{DOUBLE_STAR}}');
                  
                  // * を[^/]*に置き換え（ディレクトリ区切り以外の任意の文字列）
                  regexStr = regexStr.replace(/\*/g, '[^/]*');
                  
                  // **のプレースホルダーを.*に戻す（任意のパス）
                  regexStr = regexStr.replace(/\{\{DOUBLE_STAR\}\}/g, '.*');
                  
                  // ?を任意の1文字に置き換え
                  regexStr = regexStr.replace(/\?/g, '.');
                  
                  return new RegExp(`^${regexStr}$`);
                }
                
                const regex = globToRegExp(pattern);
                console.log(`パターン '${pattern}' → 正規表現 '${regex.toString()}'`);
                
                // ファイル名をパターンと比較（./を含む場合と含まない場合の両方を試す）
                if (regex.test(filename)) {
                  console.log(`ファイル '${filename}' はパターン '${pattern}' に一致して除外されます`);
                  return false; // 除外パターンに一致
                }
              }
              
              return true; // どの除外パターンにも一致しない
            }

            // 除外パターンを適用して変更行数を計算
            const filteredFiles = allFiles.filter(file => shouldIncludeFile(file.filename));
            console.log(`計測対象ファイル数: ${filteredFiles.length} / ${allFiles.length}`);

            if (filteredFiles.length < allFiles.length) {
              console.log(`除外されたファイル: ${allFiles.filter(f => !shouldIncludeFile(f.filename)).map(f => f.filename).join(', ')}`);
            }

            const totalChanges = filteredFiles.reduce((sum, file) => sum + file.additions + file.deletions, 0);
            console.log(`計測対象の変更行数: ${totalChanges}`);

            if (totalChanges > THRESHOLD) {              
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              
              for (const comment of comments.data) {
                if (comment.body.includes(WARNING_ID_COMMENT)) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id
                  });
                }
              }
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `> [!WARNING]\n> 行数計測対象のファイルの差分が ${THRESHOLD} 行を超えています(${totalChanges}行)。\n> レビューの効率と品質を保つため、可能であれば PR を小さく分割することを検討してください。\nまた、必要であれば PullRequest に「team+除外」ラベルを付けて Findy team+ の計測対象から外してください。\n${WARNING_ID_COMMENT}`
              });
            }
