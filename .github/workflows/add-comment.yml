name: Check PR Size

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        env:
          THRESHOLD: 100
          WARNING_ID_COMMENT: "<!-- PR_SIZE_CHECK_WARNING -->"
        with:
          script: |
            const { THRESHOLD, WARNING_ID_COMMENT } = process.env;
            const totalChanges = context.payload.pull_request.additions + context.payload.pull_request.deletions;

            if (totalChanges > THRESHOLD) {              
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              
              for (const comment of comments.data) {
                if (comment.body.includes(WARNING_ID_COMMENT)) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id
                  });
                }
              }
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `> [!WARNING]\n> PR の変更行数が ${THRESHOLD} 行を超えています（${totalChanges}行）。\n> レビューの効率と品質を保つため、可能であれば PR を小さく分割することを検討してください。\nまた、必要であれば PullRequest に「team+除外」ラベルを付けて Findy team+ の計測対象から外してください。\n${WARNING_ID_COMMENT}`
              });
            }
